[package]
name = "film-scanner"
description = "Open-source film scanning workflow: scan, crop, invert, adjust, export"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "film-scanner"
path = "src/main.rs"

[dependencies]
scan-core.workspace = true
scan-process = { workspace = true, features = ["serde"] }
scan-film.workspace = true
scan-wia.workspace = true
scan-epson.workspace = true
scan-sane.workspace = true
eframe = { workspace = true, features = ["persistence"] }
rfd.workspace = true
log.workspace = true
env_logger.workspace = true
jiff.workspace = true
serde.workspace = true
ron.workspace = true
tiff.workspace = true
egui_extras.workspace = true

[build-dependencies]
winresource = "0.1"

[lints]
workspace = true

[dev-dependencies]
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts"] }
tempfile.workspace = true
yaml-rust2 = "0.13.0"
