<svg xmlns="http://www.w3.org/2000/svg" width="300" height="130" viewBox="0 0 300 130">
  <defs>
    <linearGradient id="normal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ececec"/><stop offset="1" stop-color="#0c0c0c"/></linearGradient>
    <linearGradient id="bright" x1="0" y1="0" x2="1" y2="0"><stop offset="0.3" stop-color="#ffffff"/><stop offset="1" stop-color="#4a4a4a"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="300" height="130" rx="8" fill="{bg}"/>
  <g font-family="sans-serif" font-size="11">
    <text x="12" y="28" fill="{fg}">Normal</text>
    <rect x="90" y="16" width="200" height="16" fill="url(#normal)"/>
    <g fill="#6a6a6a">
      <rect x="236" y="19" width="2" height="2"/><rect x="246" y="26" width="2" height="2"/><rect x="252" y="20" width="2" height="2"/>
      <rect x="260" y="27" width="2" height="2"/><rect x="266" y="18" width="2" height="2"/><rect x="272" y="24" width="2" height="2"/>
      <rect x="278" y="29" width="2" height="2"/><rect x="284" y="19" width="2" height="2"/><rect x="242" y="29" width="2" height="2"/>
      <rect x="256" y="24" width="2" height="2"/><rect x="270" y="28" width="2" height="2"/><rect x="282" y="25" width="2" height="2"/>
    </g>
    <text x="12" y="58" fill="{extra}">Extra +EV</text>
    <rect x="90" y="46" width="200" height="16" fill="url(#bright)"/>
    <text x="12" y="88" fill="{merge}">Merged</text>
    <rect x="90" y="76" width="200" height="16" fill="url(#normal)"/>
    <text x="290" y="110" fill="{muted}" text-anchor="end" font-size="10">densest film: noisy, then clean</text>
    <text x="90" y="110" fill="{muted}" font-size="10">clear film</text>
    <text x="150" y="124" fill="{muted}" text-anchor="middle" font-size="10">the brighter pass reads into the dense end without the noise</text>
  </g>
</svg>
