<svg xmlns="http://www.w3.org/2000/svg" width="280" height="100" viewBox="0 0 280 100">
  <defs>
    <linearGradient id="temp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="{blue}"/><stop offset="0.5" stop-color="#c8c8c8"/><stop offset="1" stop-color="{amber}"/></linearGradient>
    <linearGradient id="tint" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="{green}"/><stop offset="0.5" stop-color="#c8c8c8"/><stop offset="1" stop-color="{magenta}"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="280" height="100" rx="8" fill="{bg}"/>
  <g font-family="sans-serif" font-size="11">
    <text x="12" y="27" fill="{temperature}">Temperature</text>
    <rect x="100" y="16" width="170" height="14" rx="3" fill="url(#temp)"/>
    <text x="104" y="44" fill="{muted}" font-size="10">− cooler</text>
    <text x="266" y="44" fill="{muted}" font-size="10" text-anchor="end">warmer +</text>
    <text x="12" y="67" fill="{tint}">Tint</text>
    <rect x="100" y="56" width="170" height="14" rx="3" fill="url(#tint)"/>
    <text x="104" y="84" fill="{muted}" font-size="10">− green</text>
    <text x="266" y="84" fill="{muted}" font-size="10" text-anchor="end">magenta +</text>
  </g>
</svg>
