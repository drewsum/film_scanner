<svg xmlns="http://www.w3.org/2000/svg" width="290" height="155" viewBox="0 0 290 155">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="{straighten}"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="290" height="155" rx="8" fill="{bg}"/>
  <g font-family="sans-serif" font-size="11">
    <g transform="rotate(-6 120 75)">
      <rect x="30" y="25" width="180" height="100" fill="{grid}" stroke="{muted}" stroke-width="1.2"/>
      <path d="M30,92 L80,70 L110,82 L150,58 L210,92" fill="{muted}" opacity="0.6"/>
      <path d="M30,92 H210" stroke="{level}" stroke-width="2.2"/>
    </g>
    <rect x="45" y="34" width="150" height="82" fill="none" stroke="{straighten}" stroke-width="1.8" stroke-dasharray="6,3"/>
    <path d="M232,32 A75,75 0 0 1 236,96" stroke="{straighten}" stroke-width="1.8" fill="none" marker-end="url(#head)"/>
    <text x="242" y="56" fill="{straighten}">+</text>
    <text x="242" y="70" fill="{straighten}" font-size="10">clock-</text>
    <text x="242" y="82" fill="{straighten}" font-size="10">wise</text>
    <text x="16" y="146" fill="{level}">— a horizon to level along</text>
    <text x="274" y="146" fill="{straighten}" text-anchor="end" font-size="10">- - cut: no empty corners</text>
  </g>
</svg>
