<svg xmlns="http://www.w3.org/2000/svg" width="290" height="140" viewBox="0 0 290 140">
  <defs>
    <radialGradient id="edges" cx="0.5" cy="0.5" r="0.62">
      <stop offset="0.35" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.7"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="290" height="140" rx="8" fill="{bg}"/>
  <g font-family="sans-serif" font-size="11">
    <rect x="15" y="15" width="120" height="80" fill="#a0a0a0"/>
    <rect x="15" y="15" width="120" height="80" fill="url(#edges)"/>
    <g stroke="{falloff}" stroke-width="1.8" fill="none">
      <path d="M57,41 L27,25 m8,0 h-8 v6"/>
      <path d="M93,41 L123,25 m-8,0 h8 v6"/>
      <path d="M57,69 L27,85 m8,0 h-8 v-6"/>
      <path d="M93,69 L123,85 m-8,0 h8 v-6"/>
    </g>
    <text x="75" y="113" fill="{falloff}" text-anchor="middle">Light falloff</text>
    <text x="75" y="127" fill="{falloff}" text-anchor="middle" font-size="10">dark corners brought up</text>
    <rect x="155" y="15" width="120" height="80" fill="#a0a0a0"/>
    <rect x="155" y="15" width="120" height="80" fill="url(#edges)" opacity="0.8"/>
    <text x="215" y="59" fill="#202020" text-anchor="middle" font-size="10">− darker corners</text>
    <text x="215" y="113" fill="{vignette}" text-anchor="middle">Vignette</text>
    <text x="215" y="127" fill="{vignette}" text-anchor="middle" font-size="10">− darker or + lighter, for effect</text>
  </g>
</svg>
