<svg xmlns="http://www.w3.org/2000/svg" width="310" height="125" viewBox="0 0 310 125">
  <rect x="0" y="0" width="310" height="125" rx="8" fill="{bg}"/>
  <g font-family="sans-serif" font-size="11" text-anchor="middle">
    <g fill="{muted}">
      <rect x="10" y="16" width="68" height="22"/><rect x="10" y="44" width="68" height="22"/>
      <rect x="85" y="16" width="68" height="22"/><rect x="85" y="44" width="68" height="22"/>
      <rect x="160" y="16" width="68" height="22"/><rect x="160" y="44" width="68" height="22"/>
      <rect x="235" y="16" width="68" height="22"/><rect x="235" y="44" width="68" height="22"/>
    </g>
    <g fill="{grid}">
      <rect x="12" y="19" width="20" height="16"/><rect x="34" y="19" width="20" height="16"/><rect x="56" y="19" width="20" height="16"/>
      <rect x="12" y="47" width="20" height="16"/><rect x="34" y="47" width="20" height="16"/><rect x="56" y="47" width="20" height="16"/>
      <rect x="87" y="19" width="20" height="16"/><rect x="109" y="19" width="20" height="16"/><rect x="131" y="19" width="20" height="16"/>
      <rect x="87" y="47" width="20" height="16"/><rect x="109" y="47" width="20" height="16"/><rect x="131" y="47" width="20" height="16"/>
      <rect x="162" y="19" width="20" height="16"/><rect x="184" y="19" width="20" height="16"/><rect x="206" y="19" width="20" height="16"/>
      <rect x="162" y="47" width="20" height="16"/><rect x="184" y="47" width="20" height="16"/><rect x="206" y="47" width="20" height="16"/>
      <rect x="237" y="19" width="20" height="16"/><rect x="259" y="19" width="20" height="16"/><rect x="281" y="19" width="20" height="16"/>
      <rect x="237" y="47" width="20" height="16"/><rect x="259" y="47" width="20" height="16"/><rect x="281" y="47" width="20" height="16"/>
    </g>
    <g fill="{scanned}">
      <text x="22" y="31">1</text><text x="44" y="31">2</text><text x="66" y="31">3</text>
      <text x="22" y="59">4</text><text x="44" y="59">5</text><text x="66" y="59">6</text>
      <text x="44" y="84">as scanned</text>
    </g>
    <g fill="{frames}">
      <text x="97" y="31">3</text><text x="119" y="31">2</text><text x="141" y="31">1</text>
      <text x="97" y="59">6</text><text x="119" y="59">5</text><text x="141" y="59">4</text>
      <text x="119" y="84">frames</text><text x="119" y="97">backwards</text>
    </g>
    <g fill="{strips}">
      <text x="172" y="31">4</text><text x="194" y="31">5</text><text x="216" y="31">6</text>
      <text x="172" y="59">1</text><text x="194" y="59">2</text><text x="216" y="59">3</text>
      <text x="194" y="84">strips</text><text x="194" y="97">backwards</text>
    </g>
    <g fill="{all}">
      <text x="247" y="31">6</text><text x="269" y="31">5</text><text x="291" y="31">4</text>
      <text x="247" y="59">3</text><text x="269" y="59">2</text><text x="291" y="59">1</text>
      <text x="269" y="84">all</text><text x="269" y="97">backwards</text>
    </g>
    <text x="155" y="117" fill="{muted}" font-size="10">two strips of three frames, as they lie on the bed</text>
  </g>
</svg>
