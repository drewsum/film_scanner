<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150" viewBox="0 0 300 150">
  <rect x="0" y="0" width="300" height="150" rx="8" fill="{bg}"/>
  <g font-family="sans-serif" font-size="11">
    <text x="12" y="20" fill="{grain}">Grain</text>
    <rect x="70" y="10" width="220" height="60" fill="{grid}"/>
    <path d="M70,55 l5,-6 l5,9 l5,-8 l5,7 l5,-9 l5,8 l5,-6 l5,9 l5,-8 l5,6 l5,-7 l5,8 l5,-6 l5,5 l5,-4 L156,24 l5,4 l5,-7 l5,8 l5,-6 l5,7 l5,-8 l5,6 l5,-5 l5,7 l5,-6 l5,8 l5,-7 l5,6 l5,-5 l5,7 l5,-6 l5,5 l5,-4 l5,6 l5,-5 l5,4 H290" stroke="{muted}" stroke-width="1.2" fill="none"/>
    <path d="M70,55 H150 L158,24 H290" stroke="{grain}" stroke-width="2.4" fill="none"/>
    <path d="M75,76 h10" stroke="{size}" stroke-width="1.4"/>
    <path d="M75,73 v6 M85,73 v6" stroke="{size}" stroke-width="1.4"/>
    <text x="90" y="80" fill="{size}" font-size="10">size</text>
    <text x="290" y="82" fill="{grain}" text-anchor="end" font-size="10">flat areas smoothed, the edge kept</text>
    <text x="12" y="112" fill="{color}">Color</text>
    <text x="12" y="125" fill="{color}">noise</text>
    <g stroke="{bg}" stroke-width="1">
      <rect x="70" y="96" width="14" height="14" fill="#8a7a7a"/><rect x="84" y="96" width="14" height="14" fill="#7a8a7c"/>
      <rect x="98" y="96" width="14" height="14" fill="#7c7a8c"/><rect x="112" y="96" width="14" height="14" fill="#8c867a"/>
      <rect x="70" y="110" width="14" height="14" fill="#7a868a"/><rect x="84" y="110" width="14" height="14" fill="#8a7a88"/>
      <rect x="98" y="110" width="14" height="14" fill="#828a78"/><rect x="112" y="110" width="14" height="14" fill="#887c7a"/>
    </g>
    <path d="M136,110 h26 l-6,-5 M162,110 l-6,5" stroke="{color}" stroke-width="1.6" fill="none"/>
    <rect x="172" y="96" width="56" height="28" fill="#818181"/>
    <text x="236" y="114" fill="{color}" font-size="10">blotches gone</text>
    <text x="150" y="142" fill="{muted}" text-anchor="middle" font-size="10">detail in brightness kept</text>
  </g>
</svg>
