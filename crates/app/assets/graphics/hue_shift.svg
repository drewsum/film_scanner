<svg xmlns="http://www.w3.org/2000/svg" width="280" height="140" viewBox="0 0 280 140">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="{hue}"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="280" height="140" rx="8" fill="{bg}"/>
  <g font-family="sans-serif" font-size="11">
    <circle cx="80" cy="70" r="40" fill="none" stroke="{grid}" stroke-width="12"/>
    <circle cx="120" cy="70" r="9" fill="{red}"/>
    <circle cx="100" cy="35.4" r="9" fill="{yellow}"/>
    <circle cx="60" cy="35.4" r="9" fill="{green}"/>
    <circle cx="40" cy="70" r="9" fill="{cyan}"/>
    <circle cx="60" cy="104.6" r="9" fill="{blue}"/>
    <circle cx="100" cy="104.6" r="9" fill="{magenta}"/>
    <path d="M136,58 A57,57 0 0 0 112,20" stroke="{hue}" stroke-width="2" fill="none" marker-end="url(#head)"/>
    <path d="M136,82 A57,57 0 0 1 112,120" stroke="{muted}" stroke-width="1.4" stroke-dasharray="4,3" fill="none"/>
    <text x="150" y="44" fill="{hue}">+ towards the next</text>
    <text x="150" y="58" fill="{hue}">hue round: reds</text>
    <text x="150" y="72" fill="{hue}">towards yellow</text>
    <text x="150" y="100" fill="{muted}">− back: reds</text>
    <text x="150" y="114" fill="{muted}">towards magenta</text>
  </g>
</svg>
