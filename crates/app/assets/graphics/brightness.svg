<svg xmlns="http://www.w3.org/2000/svg" width="260" height="140" viewBox="0 0 260 140">
  <rect x="0" y="0" width="260" height="140" rx="8" fill="{bg}"/>
  <g font-family="sans-serif" font-size="11">
    <rect x="30" y="15" width="130" height="100" fill="{grid}"/>
    <path d="M30,115 L160,15" stroke="{muted}" stroke-width="1" stroke-dasharray="4,3" fill="none"/>
    <path d="M30,115 Q120,98 160,15" stroke="{muted}" stroke-width="1.6" fill="none"/>
    <path d="M30,115 Q60,30 160,15" stroke="{brightness}" stroke-width="2.4" fill="none"/>
    <circle cx="30" cy="115" r="3.5" fill="{fg}"/>
    <circle cx="160" cy="15" r="3.5" fill="{fg}"/>
    <text x="172" y="40" fill="{brightness}">+ midtones</text>
    <text x="172" y="54" fill="{brightness}">lighter</text>
    <text x="172" y="96" fill="{muted}">− darker</text>
    <text x="95" y="130" fill="{muted}" text-anchor="middle" font-size="10">● black and white stay</text>
  </g>
</svg>
