<svg xmlns="http://www.w3.org/2000/svg" width="280" height="120" viewBox="0 0 280 120">
  <defs>
    <linearGradient id="cr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="{cyan}"/><stop offset="1" stop-color="{red}"/></linearGradient>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="{magenta}"/><stop offset="1" stop-color="{green}"/></linearGradient>
    <linearGradient id="yb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="{yellow}"/><stop offset="1" stop-color="{blue}"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="280" height="120" rx="8" fill="{bg}"/>
  <g font-family="sans-serif" font-size="11">
    <text x="12" y="27" fill="{cr}">Cyan − Red</text>
    <rect x="110" y="16" width="160" height="14" rx="3" fill="url(#cr)"/>
    <text x="12" y="57" fill="{mg}">Magenta − Green</text>
    <rect x="110" y="46" width="160" height="14" rx="3" fill="url(#mg)"/>
    <text x="12" y="87" fill="{yb}">Yellow − Blue</text>
    <rect x="110" y="76" width="160" height="14" rx="3" fill="url(#yb)"/>
    <path d="M190,12 V94" stroke="{fg}" stroke-width="1.4" stroke-dasharray="3,2"/>
    <text x="114" y="108" fill="{muted}" font-size="10">−</text>
    <text x="190" y="108" fill="{fg}" text-anchor="middle" font-size="10">0 EV</text>
    <text x="266" y="108" fill="{muted}" text-anchor="end" font-size="10">+</text>
  </g>
</svg>
